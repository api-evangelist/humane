name: Humane
description: 'Humane was a consumer AI hardware startup, founded by former Apple engineers,
  best known for the AI Pin — a screenless, wearable AI-powered device — and its companion
  Cosmos operating system and Humane.Center cloud service. The company was acquired
  by HP in early 2025, the AI Pin was discontinued, and its cloud services and humane.com
  domain were taken offline. It was surfaced as a portfolio company of Kindred Ventures
  and added to the API Evangelist network for enrichment. As of this pass the company
  has no reachable web, developer, or API surface.'
